plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'com.gradleup.shadow'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation 'maven.modrinth:polylib:uazcDB6Q'
    implementation 'io.sentry:sentry:5.7.2'
    shadow('io.sentry:sentry:5.7.2') { transitive = false }
}
loom { runs { client { client(); runDir('runs/client') }; server { server(); runDir('runs/server') } } }
jar { archiveClassifier = 'dev' }
shadowJar {
    dependsOn jar
    configurations = [project.configurations.shadow]
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    relocate 'io.sentry', 'net.creeperhost.resourcefulcreepers.io.sentry'
    archiveClassifier = ''
}
assemble.dependsOn shadowJar
