plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'com.gradleup.shadow'
}
neoForge {
    version = neoforge_version
    runs { client { client() }; server { server() } }
    mods { resourcefulcreepers { sourceSet sourceSets.main } }
}
dependencies {
    implementation 'maven.modrinth:polylib:avoIyuDR'
    implementation 'io.sentry:sentry:5.7.2'
    shadow('io.sentry:sentry:5.7.2') { transitive = false }
}
jar { archiveClassifier = 'dev' }
shadowJar {
    dependsOn jar
    configurations = [project.configurations.shadow]
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    relocate 'io.sentry', 'net.creeperhost.resourcefulcreepers.io.sentry'
    archiveClassifier = ''
}
assemble.dependsOn shadowJar
