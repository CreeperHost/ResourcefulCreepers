plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}
neoForge { neoFormVersion = '26.3-1' }
dependencies {
    compileOnly 'net.fabricmc:fabric-loader:0.19.5'
    compileOnly 'org.spongepowered:mixin:0.8.7'
    compileOnly 'maven.modrinth:polylib:uazcDB6Q'
    implementation 'io.sentry:sentry:5.7.2'
}
configurations {
    commonJava { canBeResolved = false; canBeConsumed = true }
    commonResources { canBeResolved = false; canBeConsumed = true }
}
artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { configurations.named(it) { attributes { attribute(loaderAttribute, 'common') } } }
