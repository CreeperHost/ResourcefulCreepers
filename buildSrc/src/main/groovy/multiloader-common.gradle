plugins {
    id 'java-library'
}
version = rootProject.mod_version
group = rootProject.maven_group
base { archivesName = "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version}" }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories {
    mavenCentral()
    maven { url 'https://api.modrinth.com/maven' }
    maven { url 'https://maven.creeperhost.net' }
    maven { url 'https://maven.fabricmc.net/' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) { expand version: project.version }
}
